# nequip-distill -- rattle a set of base frames, label them with a teacher, and
# train a student on the result. One command, one config.
#
#   nequip-distill -cp /abs/path/to/this/directory -cn rattle_template
#
# Two things about paths, both inherited from hydra and both easy to trip over:
#   * `-cp` MUST be an absolute path. A relative one is resolved against the
#     module the entry point lives in, not your shell, and fails with
#     "Primary config module ... not found". `nequip-train` behaves the same way.
#   * hydra does not chdir, so every relative path below resolves against the
#     directory you launch from. Absolute paths are safer on a shared cluster.
#
# Every `???` is a value you must supply. Fill ALL of them before launching.
# `sample_path` and the two sampler paths are checked before anything expensive
# happens. `model_type_names` is NOT -- it is only read once the trainer starts,
# which is after sampling has finished, so a forgotten element list costs you the
# whole sampling run. Check it by eye first:
#
#   nequip-distill -cp /abs/path -cn rattle_template --cfg job
#
# (plain `--cfg job`, without `--resolve`: resolving needs a nequip resolver that
# only exists inside a live training run.)

# ---------------------------------------------------------------- what to run
# `sample` builds the dataset; train/val/test hand it to nequip's trainer.
# Drop the tail (`run: [sample]`) to build a dataset and stop. Drop `sample`
# (`run: [train, val, test]`) to train another student on a dataset that already
# exists -- the teacher is not loaded at all in that case.
run: [sample, train, val, test]

# Where the labeled structures live: train.extxyz, val.extxyz, test.extxyz plus a
# sampler_state.pt progress record. Keep this OUTSIDE the hydra output directory
# -- the dataset outlives any single command, and pointing hydra.run.dir at or
# inside sample_path breaks the sampler. Re-running with the same sample_path and
# an unchanged sampler section continues the dataset instead of rebuilding it.
sample_path: ???   # FILL IN, e.g. /scratch/<you>/distill/cdp_rattle_v1

# ------------------------------------------------------------------- sampling
sampler:
  _target_: nequip_extension_template.sample.RattleSampler

  # The teacher, as an ASE calculator. `_from_saved_model` is the load path for a
  # `nequip-package` artifact (.nequip.zip) or a raw .ckpt.
  #
  # Compiled artifacts: `--mode torchscript` is refused by torch >= 2.10, and
  # `--mode aotinductor --target ase` produced a .pt2 that segfaulted on its first
  # forward pass in our environment. A packaged .nequip.zip is slower but works.
  # An aotinductor artifact is also GPU-arch specific -- one compiled on an A100
  # is invalid on an H200.
  calculator:
    _target_: nequip.integrations.ase.NequIPCalculator._from_saved_model
    model_path: ???   # FILL IN, absolute path to the teacher .nequip.zip
    device: cuda
    chemical_species_to_atom_type_map: true

  # Structures the rattling starts from, in any format ASE can read. Any labels
  # they carry are discarded -- the teacher relabels everything.
  #
  # Count matters for the split: it is assigned per BASE FRAME, so with the
  # fractions below you want at least 10 of them for val and test to be non-empty.
  base_frames: ???   # FILL IN, absolute path to e.g. base_frames.xyz

  # How the base frames are divided. Per base frame, not per structure: the
  # variants rattled from one base frame are near-duplicates, and splitting them
  # apart would leak training data into val and test. The assignment is frozen
  # when the structures are written and is never recomputed at train time.
  # `scattered` because base frames have no meaningful order.
  split: {train: 0.8, val: 0.1, test: 0.1}
  split_policy: scattered
  split_seed: 0

  # One structure per isotropic strain, plus `n_random_strain_samples` random
  # anisotropic ones, each followed by a per-atom rattle. Here: 3 + 2 = 5
  # structures per base frame.
  #
  # THESE MAGNITUDES ARE NOT ARBITRARY. An earlier campaign used +/-10% isotropic
  # strain, 5% anisotropic and 0.5 Ang displacement; the structures fell outside
  # what the teacher could label sensibly and students trained on them came out
  # WORSE than students trained without synthetic data at all. Halving everything
  # fixed it. Raise these only with a reason, and check the teacher's predictions
  # on the result before trusting a student.
  strain_magnitudes: [-0.05, 0.0, 0.05]
  n_random_strain_samples: 2
  # Deliberately independent of `strain_magnitudes`. Deriving it from them coupled
  # two knobs: adding one isotropic scan point silently widened the anisotropic
  # distribution, changing structures nothing was named after.
  anisotropic_strain_magnitude: 0.05
  # Bound on the per-atom displacement, measured against the STRAINED parent.
  max_displacement_ang: 0.25

  # Every structure is seeded from this plus its own identity, so the set does not
  # depend on generation order and adding base frames later leaves existing
  # structures bit-identical. Changing it invalidates a dataset already on disk.
  seed: 1

# --------------------------------------------------------------- student setup
# Ordinary nequip config from here down, passed through untouched except for the
# three dataset file paths, which nequip-distill fills in from `sample_path`.

seed: 1
cutoff_radius: 6.0
model_type_names: ???   # FILL IN, e.g. [Cs, H, P, O] -- every element in your frames
monitored_metric: val0_epoch/weighted_sum

data:
  # ASEDataModule specifically: nequip-distill wires the dataset in through its
  # train_file_path/val_file_path/test_file_path arguments. Do not set those here,
  # and do not set `split_dataset` -- the splits are already fixed on disk.
  _target_: nequip.data.datamodule.ASEDataModule
  seed: ${seed}

  transforms:
    - _target_: nequip.data.transforms.ChemicalSpeciesToAtomTypeMapper
      model_type_names: ${model_type_names}
    - _target_: nequip.data.transforms.NeighborListTransform
      r_max: ${cutoff_radius}

  train_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 5
    num_workers: 4
    shuffle: true
  val_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 10
    num_workers: ${data.train_dataloader.num_workers}
  test_dataloader: ${data.val_dataloader}

  stats_manager:
    _target_: nequip.data.CommonDataStatisticsManager
    dataloader_kwargs:
      batch_size: 10
    type_names: ${model_type_names}

trainer:
  _target_: lightning.Trainer
  accelerator: gpu
  enable_checkpointing: true
  max_epochs: 100
  log_every_n_steps: 20

  # Swap for WandbLogger if you want it; CSVLogger keeps the run self-contained.
  logger:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${hydra:runtime.output_dir}

  callbacks:
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: ${monitored_metric}
      min_delta: 1e-3
      patience: 20

    # Checkpoints land in this command's hydra output directory. `best.ckpt` is
    # the best on the monitored metric. `last.ckpt` is a copy of whatever was last
    # SAVED, and with a monitor set that only happens on an improvement -- so it
    # tracks the best, not the newest epoch. Restart with
    # `ckpt_path=<abs>/last.ckpt` and note it resumes from the last improvement.
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: ${monitored_metric}
      dirpath: ${hydra:runtime.output_dir}
      filename: best
      save_last: true

    - _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: epoch

training_module:
  _target_: nequip.train.EMALightningModule
  ema_decay: 0.999

  loss:
    _target_: nequip.train.EnergyForceLoss
    per_atom_energy: true
    coeffs:
      total_energy: 1.0
      forces: 1.0

  val_metrics:
    _target_: nequip.train.EnergyForceMetrics
    coeffs:
      total_energy_mae: 1.0
      forces_mae: 1.0
  train_metrics: ${training_module.val_metrics}
  test_metrics: ${training_module.val_metrics}

  optimizer:
    _target_: torch.optim.Adam
    lr: 0.01

  lr_scheduler:
    scheduler:
      _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
      factor: 0.6
      patience: 5
      threshold: 0.2
      min_lr: 1e-6
    monitor: ${monitored_metric}
    interval: epoch
    frequency: 1

  model:
    # Small student: 2 layers, l_max 1. This is the architecture our CDP students
    # were trained with, not a tuned optimum -- size it to your teacher and budget.
    _target_: nequip.model.NequIPGNNModel
    seed: ${seed}
    model_dtype: float32
    type_names: ${model_type_names}
    r_max: ${cutoff_radius}

    num_bessels: 8
    bessel_trainable: false
    polynomial_cutoff_p: 6

    num_layers: 2
    l_max: 1
    parity: true
    num_features: [32, 16]

    radial_mlp_depth: 2
    radial_mlp_width: 64

    avg_num_neighbors: ${training_data_stats:num_neighbors_mean}
    per_type_energy_scales: ${training_data_stats:per_type_forces_rms}
    per_type_energy_shifts: ${training_data_stats:per_atom_energy_mean}
    per_type_energy_scales_trainable: false
    per_type_energy_shifts_trainable: false
