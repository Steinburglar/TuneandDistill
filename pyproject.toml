[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nequip-extension-template"
dynamic = ["version"]
description = "TODO"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "your name here"},
]

dependencies = [
    # 0.17.1 is what every run and every integration fact in CLAUDE.md was checked
    # against. No upper bound, so newer nequip can be used -- but the student side
    # leans on `nequip.scripts.train.main` taking a config as its first argument and
    # on the `run_stage` restart semantics, both read out of 0.17.1's source, so
    # re-check those two if a newer nequip misbehaves.
    "nequip>=0.17.1"
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["nequip-extension-template", "nequip_extension_template", "nequip_extension_template.*"]

[tool.setuptools.dynamic]
version = {attr = "nequip_extension_template._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is deliberately CPU-only and teacher-free -- see tests/test_resume.py.
addopts = "-q"

[tool.ruff]
line-length = 88
exclude = [
    ".eggs",
    "*.egg",
    "build",
    "dist",
    "docs",
    ".git",
    "__pycache__",
    "examples",
    "tmp"
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["E226", "E501", "E741", "E743", "C901", "E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.scripts]
nequip-distill = "nequip_extension_template.scripts.distill:main"

[project.entry-points."nequip.extension"]
init_always = "nequip_extension_template"
